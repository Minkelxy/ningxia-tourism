name: Verify and deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Dependency audit
        run: npm run audit
      - name: Validate content data
        run: npm run validate:data
      - name: Verification reminder (warning only, never blocks build)
        run: npm run validate:data:reminder
      - name: Type check
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          # 应用修订号变化不应让浏览器缓存频繁失效；Playwright 升级时手动递增 v1。
          key: ${{ runner.os }}-playwright-v1
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        # ubuntu-latest 已提供 Chromium 所需系统库，只下载浏览器本体即可。
        run: npx playwright install chromium
      - name: End-to-end tests
        run: npm run test:e2e
        env:
          VITE_BASE_URL: /ningxia-tourism/
      - name: Production build
        run: npm run build
        env:
          VITE_BASE_URL: /ningxia-tourism/
      - name: Verify Pages deep-link fallback
        run: npm run verify:pages-fallback
      - name: Lighthouse quality gate
        run: npm run quality:lighthouse
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
